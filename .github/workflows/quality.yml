name: Production quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: private_shelf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_shelf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/private_shelf
      DATABASE_SSL: "false"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync pinned Vengeance UI
        run: npm run vengeance:sync

      - name: Prepare database
        run: npm run db:setup

      - name: Contract checks
        run: npm run contract-check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Runtime smoke test
        shell: bash
        run: |
          npm start > /tmp/book-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/book-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/book-next.log
            exit 1
          fi

          grep -q "Attraction is" /tmp/book-home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/library > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/books/magnetic-presence > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/admin > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/admin/status > /dev/null

          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT
