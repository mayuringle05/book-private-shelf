name: Production quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: private_shelf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_shelf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/private_shelf
      DATABASE_SSL: "false"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync pinned Vengeance UI
        run: npm run vengeance:sync

      - name: Vendor pinned Vengeance UI on release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/production-ui-2026'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/components/ui package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Vendored Vengeance source already matches the pinned registry."
          else
            git commit -m "chore: vendor pinned Vengeance UI"
            git push origin HEAD:feat/production-ui-2026
          fi

      - name: Verify vendored Vengeance source on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- src/components/ui package.json package-lock.json

      - name: Prepare database
        run: npm run db:setup

      - name: Contract checks
        run: npm run contract-check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Runtime smoke and visual captures
        shell: bash
        run: |
          npm start > /tmp/book-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/book-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/book-next.log
            exit 1
          fi

          grep -q "Attraction is" /tmp/book-home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/library > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/books/magnetic-presence > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/admin > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/admin/status > /dev/null

          mkdir -p screenshots
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is required for visual release captures"
            exit 1
          fi

          capture() {
            local size="$1"
            local output="$2"
            local url="$3"
            "$CHROME_BIN" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --enable-webgl \
              --ignore-gpu-blocklist \
              --virtual-time-budget=5000 \
              --window-size="$size" \
              --screenshot="screenshots/$output" \
              "$url"
          }

          capture 1440,1000 home-desktop.png http://127.0.0.1:3000/
          capture 1440,1000 library-desktop.png http://127.0.0.1:3000/library
          capture 1440,1000 book-desktop.png http://127.0.0.1:3000/books/magnetic-presence
          capture 1440,1000 admin-desktop.png http://127.0.0.1:3000/admin
          capture 390,844 home-mobile.png http://127.0.0.1:3000/
          capture 390,844 library-mobile.png http://127.0.0.1:3000/library

          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload visual release captures
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-captures
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
