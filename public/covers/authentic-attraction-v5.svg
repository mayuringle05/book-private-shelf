<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Authentic Attraction — BOOK</title><desc id="desc">Engraved line-work edition: two overlapping circles built from fine parallel copper and cream hatching that cross-hatches where the forms meet.</desc>
  <defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="soft-light"/></filter>
  <pattern id="hH" width="9" height="7" patternUnits="userSpaceOnUse"><path d="M0 3.5H9" stroke="#C98762" stroke-opacity=".9" stroke-width="1.1"/></pattern>
  <pattern id="hV" width="7" height="9" patternUnits="userSpaceOnUse"><path d="M3.5 0V9" stroke="#F3EDE3" stroke-opacity=".6" stroke-width="1"/></pattern></defs>
  <rect width="800" height="1200" fill="#090807"/><g filter="url(#paper)"><rect x="44" y="44" width="712" height="1112" fill="none" stroke="#F3EDE3" stroke-opacity=".28"/><text x="76" y="102" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="8">BOOK</text><text x="724" y="102" fill="#F3EDE3" fill-opacity=".78" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" letter-spacing="4">VOL. 02</text><line x1="76" y1="139" x2="724" y2="139" stroke="#F3EDE3" stroke-opacity=".3"/>
  <g transform="translate(400 445)"><circle cx="-95" cy="0" r="192" fill="url(#hH)"/><circle cx="-95" cy="0" r="192" fill="none" stroke="#C98762" stroke-opacity=".85" stroke-width="1.6"/><circle cx="108" cy="0" r="192" fill="url(#hV)"/><circle cx="108" cy="0" r="192" fill="none" stroke="#F3EDE3" stroke-opacity=".65" stroke-width="1.6"/><circle cx="-95" cy="0" r="176" fill="none" stroke="#C98762" stroke-opacity=".3"/><circle cx="108" cy="0" r="176" fill="none" stroke="#F3EDE3" stroke-opacity=".22"/><circle cx="6" cy="0" r="222" fill="none" stroke="#F3EDE3" stroke-opacity=".2"/><circle cx="6" cy="0" r="248" fill="none" stroke="#F3EDE3" stroke-opacity=".1"/><line x1="-294" y1="0" x2="300" y2="0" stroke="#F3EDE3" stroke-opacity=".14"/><line x1="6" y1="-248" x2="6" y2="248" stroke="#F3EDE3" stroke-opacity=".14"/></g>
  <text x="76" y="784" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">Connection without pretending</text><text x="76" y="817" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">to be someone else.</text><text x="72" y="925" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="73" letter-spacing="-3">AUTHENTIC</text><text x="72" y="1004" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="73" letter-spacing="-3">ATTRACTION</text><line x1="76" y1="1072" x2="724" y2="1072" stroke="#F3EDE3" stroke-opacity=".28"/><text x="76" y="1114" fill="#F3EDE3" fill-opacity=".85" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="4">THE PRIVATE SHELF</text><text x="724" y="1114" fill="#F3EDE3" fill-opacity=".7" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end" letter-spacing="3">ORIGINAL EDITION</text></g>
</svg>