<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Authentic Attraction — BOOK</title><desc id="desc">Typographic minimal edition: oversized serif title alone on a deep warm black field with a single hairline rule.</desc>
  <defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="soft-light"/></filter></defs>
  <rect width="800" height="1200" fill="#090807"/><g filter="url(#paper)"><rect x="44" y="44" width="712" height="1112" fill="none" stroke="#F3EDE3" stroke-opacity=".28"/><text x="76" y="102" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="8">BOOK</text><text x="724" y="102" fill="#F3EDE3" fill-opacity=".78" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" letter-spacing="4">VOL. 02</text><line x1="76" y1="139" x2="724" y2="139" stroke="#F3EDE3" stroke-opacity=".3"/>
  <text x="76" y="636" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="102" letter-spacing="-3" textLength="648" lengthAdjust="spacingAndGlyphs">AUTHENTIC</text><text x="76" y="748" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="102" letter-spacing="-3" textLength="648" lengthAdjust="spacingAndGlyphs">ATTRACTION</text>
  <line x1="76" y1="806" x2="724" y2="806" stroke="#F3EDE3" stroke-opacity=".35"/>
  <text x="76" y="860" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">Connection without pretending</text><text x="76" y="893" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">to be someone else.</text>
  <line x1="76" y1="1072" x2="724" y2="1072" stroke="#F3EDE3" stroke-opacity=".28"/><text x="76" y="1114" fill="#F3EDE3" fill-opacity=".85" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="4">THE PRIVATE SHELF</text><text x="724" y="1114" fill="#F3EDE3" fill-opacity=".7" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end" letter-spacing="3">ORIGINAL EDITION</text></g>
</svg>