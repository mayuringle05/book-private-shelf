<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Authentic Attraction — BOOK</title><desc id="desc">Foil stamp metallic edition: two interlocking rings stamped in copper-gold foil with specular highlight gradients and embossed inner edges on deep warm black.</desc>
