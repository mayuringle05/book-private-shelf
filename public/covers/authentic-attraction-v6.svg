  <text x="76" y="784" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">Connection without pretending</text><text x="76" y="817" fill="#D9CEBD" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">to be someone else.</text><text x="72" y="925" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="73" letter-spacing="-3">AUTHENTIC</text><text x="72" y="1004" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="73" letter-spacing="-3">ATTRACTION</text><line x1="76" y1="1072" x2="724" y2="1072" stroke="#C98762" stroke-opacity=".5"/><text x="76" y="1114" fill="#F3EDE3" fill-opacity=".85" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="4">THE PRIVATE SHELF</text><text x="724" y="1114" fill="#F3EDE3" fill-opacity=".7" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end" letter-spacing="3">ORIGINAL EDITION</text></g>
