<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Modern Dating — BOOK</title><desc id="desc">Typographic minimal edition: oversized serif title, generous negative space, and a single hairline rule on a deep warm near-black ground.</desc>
  <defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="47" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="soft-light"/></filter></defs>
  <rect width="800" height="1200" fill="#0B0908"/><g filter="url(#paper)"><rect x="44" y="44" width="712" height="1112" fill="none" stroke="#F3EDE3" stroke-opacity=".34"/><text x="76" y="102" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="8">BOOK</text><text x="724" y="102" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" letter-spacing="4">VOL. 03</text><line x1="76" y1="139" x2="724" y2="139" stroke="#F3EDE3" stroke-opacity=".38"/>
  <circle cx="400" cy="318" r="7" fill="#C98762"/>
  <line x1="76" y1="470" x2="724" y2="470" stroke="#F3EDE3" stroke-opacity=".3"/>
  <text x="400" y="655" text-anchor="middle" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="130" letter-spacing="-5">MODERN</text><text x="400" y="790" text-anchor="middle" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="130" letter-spacing="-5">DATING</text>
  <text x="76" y="882" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">A clearer map for apps, ambiguity,</text><text x="76" y="915" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">and real-world connection.</text>
  <line x1="76" y1="1072" x2="724" y2="1072" stroke="#F3EDE3" stroke-opacity=".38"/><text x="76" y="1114" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="4">THE PRIVATE SHELF</text><text x="724" y="1114" fill="#F3EDE3" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end" letter-spacing="3">ORIGINAL EDITION</text></g>
</svg>