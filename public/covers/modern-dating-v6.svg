<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Modern Dating — BOOK</title><desc id="desc">Foil stamp metallic edition: copper and gold foil gradient medallion and diagonal band with specular highlights and subtle emboss strokes on a deep warm near-black ground.</desc>
  <defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="47" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="soft-light"/></filter><linearGradient id="foil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DDBE"/><stop offset=".2" stop-color="#E2B183"/><stop offset=".42" stop-color="#C98762"/><stop offset=".5" stop-color="#8F5B3C"/><stop offset=".6" stop-color="#C98762"/><stop offset=".8" stop-color="#E8B98A"/><stop offset="1" stop-color="#F6DDBE"/></linearGradient><linearGradient id="foil2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2B183"/><stop offset=".45" stop-color="#8F5B3C"/><stop offset=".75" stop-color="#C98762"/><stop offset="1" stop-color="#F6DDBE"/></linearGradient><filter id="spec" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs>
