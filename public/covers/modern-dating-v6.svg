  <text x="76" y="784" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">A clearer map for apps, ambiguity,</text><text x="76" y="817" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">and real-world connection.</text>
