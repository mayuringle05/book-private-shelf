<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Modern Dating — BOOK</title><desc id="desc">Duotone photographic abstraction: soft oxblood and copper glows like city lights at night, with a dotted navigation path over a deep warm near-black ground.</desc>
  <defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="47" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="soft-light"/></filter><radialGradient id="gox"><stop offset="0" stop-color="#7A3A34"/><stop offset=".55" stop-color="#682F2D" stop-opacity=".8"/><stop offset="1" stop-color="#682F2D" stop-opacity="0"/></radialGradient><radialGradient id="gcu"><stop offset="0" stop-color="#E8A87F"/><stop offset=".5" stop-color="#C98762" stop-opacity=".7"/><stop offset="1" stop-color="#C98762" stop-opacity="0"/></radialGradient><filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter><filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter></defs>
