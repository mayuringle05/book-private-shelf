  <g><ellipse cx="205" cy="360" rx="270" ry="240" fill="url(#gox)" filter="url(#soft)"/><ellipse cx="620" cy="280" rx="210" ry="190" fill="url(#gcu)" filter="url(#soft)"/><ellipse cx="640" cy="560" rx="230" ry="170" fill="url(#gox)" filter="url(#soft)"/><ellipse cx="330" cy="600" rx="160" ry="120" fill="url(#gcu)" filter="url(#soft2)" opacity=".7"/><circle cx="560" cy="420" r="26" fill="url(#gcu)" filter="url(#soft2)"/></g>
