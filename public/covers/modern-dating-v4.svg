  <path d="M118 620C212 566 268 556 308 520C352 482 448 500 492 428C528 370 620 392 672 340" fill="none" stroke="#F3EDE3" stroke-opacity=".5" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"/>
  <text x="76" y="784" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">A clearer map for apps, ambiguity,</text><text x="76" y="817" fill="#E6DCD0" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic">and real-world connection.</text>
  <text x="72" y="930" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="83" letter-spacing="-3">MODERN</text><text x="72" y="1015" fill="#F3EDE3" font-family="Georgia,'Times New Roman',serif" font-size="83" letter-spacing="-3">DATING</text>
